spring:
  application:
    name: flash-sale-core
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  datasource:
    url: jdbc:postgresql://localhost:5432/flash_sale_db
    username: flash_user
    password: flash_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 100
      minimum-idle: 20
      connection-timeout: 5000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

application:
  security:
    bcrypt:
      strength: 4

flashsale:
  rabbitmq:
    exchange: flashsale.exchange
    queue: flashsale.order.queue
    routing-key: flashsale.order.routing.key

server:
  port: 8080
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 200
