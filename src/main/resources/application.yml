spring:
  application:
    name: flash-sale-core
  datasource:
    url: jdbc:postgresql://localhost:5432/flash_sale_db
    username: flash_user
    password: flash_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080
