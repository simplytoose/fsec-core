version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: flash-sale-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: flash_sale_db
      POSTGRES_USER: flash_user
      POSTGRES_PASSWORD: flash_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
